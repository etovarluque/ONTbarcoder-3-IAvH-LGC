# ontbarcoder_batch.cfg - one parameter per line, values separated by commas.
# Blank lines and lines starting with # are ignored.
#
# Every parameter the app accepts is listed below, commented out, showing
# the app's own default. To sweep a parameter, uncomment its line and
# replace the single default with the list of values you want to try (see
# the "Example" comment above each one). A parameter left commented out (or
# not listed at all) keeps its CURRENT value from the Parameters card — the
# same one you'd use for a manual run. Only list here what you actually want
# to vary.
#
# "Detect intra-sample sequence variants" percentages use the SAME 0-100
# scale as the GUI spinboxes (20, not 0.20) — they are stored internally as
# a fraction, but you always write them here as a percentage.

# ── Input length / demultiplexing ──────────────────────────────────────────
# Range: 0-5000   Example: 658, 660, 662
# minlen = 658

# Range: 0-5000   Example: 658, 660, 662
# explen = 658

# Range: 0-500   Example: 100, 120, 150
# demlen = 100

# Range: 10-500   Example: 100, 120
# primersearchlen = 100

# Range: 0-30   Example: 8, 10, 12
# primermismatch = 10

# Range: 0-5   Example: 1, 2, 3
# tagmm = 2

# ── Consensus calling ───────────────────────────────────────────────────────
# Main consensus calling frequency.
# Range: 0.05-0.95   Example: 0.30, 0.35, 0.40, 0.45, 0.50
# consfreqfixed = 0.30

# Range of frequencies to assess, lower bound.
# Range: 0.05-0.95   Example: 0.20, 0.25
# consfreqmin = 0.20

# Range of frequencies to assess, upper bound.
# Range: 0.05-0.95   Example: 0.50, 0.55
# consfreqmax = 0.50

# Range of frequencies to assess, step.
# Range: 0.01-0.5   Example: 0.05, 0.02
# consfreqstep = 0.05

# Range: 1-5000   Example: 3, 5, 10
# mincoverage = 5

# Range: 1-5000   Example: 50, 100, 150
# coverage2b = 100

# Range: 0-500   Example: 30, 50, 70
# lendev = 50

# QC length tolerance (± bp). 0 = exact length required.
# Range: 0-300   Example: 0, 3, 6
# qclentol = 0

# Range: 0-100000   Example: 0 (no cap), 500, 1000
# maxcoverage = 0

# Minimum mean read quality (0 = filter off).
# Range: 0-50   Example: 0, 7, 9
# minq = 0

# NCBI genetic code translation table id.
# Range: one of 1, 2, 3, 4, 5, 6, 9, 10, 11, 12, 13, 14, 16, 21, 22, 23, 24, 25, 26
# Example: 5 (Invertebrate Mitochondrial, default for COI), 2 (Vertebrate Mitochondrial)
# gencode = 5

# NOTE: the Non-Coding marker (non_coi) is NOT settable here. It decides the
# genetic code and which phases exist, so it must come from the Parameters
# panel checkbox; the batch inherits whatever is set there.

# ── Detect intra-sample sequence variants ───────────────────────────────────
# Listing any resolve_mixed.* key below turns detection ON for the whole
# batch even if the Parameters checkbox is off (otherwise every combination
# would be identical). Set it here explicitly to override that.
# Range: true/false   Example: true, false
# resolve_mixed.enabled = false

# Min. secondary variant fraction (%).
# Range: 10-50 (%)   Example: 20, 15, 10
# resolve_mixed.min_secondary_frac = 20

# Variant tolerance (%).
# Range: 0-40 (%)   Example: 10, 9, 8, 7, 6, 5
# resolve_mixed.tolerance = 10

# ── Phases / threads ─────────────────────────────────────────────────────────
# Range: true/false   Example: true, false
# run_phase1 = true

# Range: true/false   Example: true, false
# run_phase2a = true

# Range: true/false   Example: true, false
# run_phase2b = true

# Range: true/false   Example: true, false
# run_phase3 = true

# Usually left at the physical core count auto-detected at runtime.
# Range: 1-256   Example: 4, 8
# n_threads = 4

# ── Example sweep actually used below (uncomment to run) ───────────────────
# consfreqfixed                    = 0.30, 0.35, 0.40, 0.45, 0.50
resolve_mixed.min_secondary_frac = 20, 15, 10
resolve_mixed.tolerance          = 10, 8, 5
