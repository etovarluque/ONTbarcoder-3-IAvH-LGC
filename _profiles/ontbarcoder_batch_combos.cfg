# combos
#
# ontbarcoder_batch_combos.cfg - an EXPLICIT COMBINATION LIST, not a grid.
# The "# combos" marker above MUST be the file's first non-blank line —
# that's what tells the app to parse this as a combo list rather than a
# grid. Everything below it (comments included) is free-form.
#
# Kept as its own file rather than a second section inside
# ontbarcoder_batch.cfg: the two .cfg shapes are mutually exclusive (a batch
# is loaded as one or the other, never both), so mixing their examples in a
# single file invites copying the wrong block by accident. Load whichever
# file matches the shape you want with "Load batch config..." — "Create
# example cfg" / "Create example combo-list cfg" write out a copy of
# whichever one you asked for.
#
# WHEN TO USE THIS INSTEAD OF THE GRID (ontbarcoder_batch.cfg):
# A grid file is a Cartesian product: every value of every key gets crossed
# with every value of every other key. That's the wrong shape once specific
# combinations have already been picked out of a previous sweep — e.g. the
# run numbers a coverage analysis (_utilities/batch_coverage_report.py)
# found sufficient to reproduce a given result. Re-listing each of those
# parameters' distinct values in a grid file would regenerate the full
# product again, not just the combinations wanted.
#
# FORMAT (every line below the marker, other than comments/blanks):
#   key=value, key=value, key=value, ...
# — one FULL combination per line, written the same way combinations are
# already shown elsewhere in the app (combo_label(), and the "Parameters"
# column of batch_run_summary.tsv). So a row copied straight out of a
# previous batch_run_summary.tsv's Parameters column is already valid here.
# Every key/value is validated exactly like a grid file's — see
# ontbarcoder_batch.cfg for the full list of accepted keys, their valid
# ranges, and the same percent-scale note for resolve_mixed.* (written 20,
# not 0.20). A parameter never mentioned in ANY line keeps its current value
# from the Parameters panel throughout the whole batch, same as in a grid.
#
# The example below is illustrative only — replace it with whichever
# combinations you actually want to re-run (e.g. the ones a coverage
# analysis singled out from a previous grid sweep).

consfreqfixed=0.30, resolve_mixed.min_secondary_frac=20, resolve_mixed.tolerance=10
consfreqfixed=0.40, resolve_mixed.min_secondary_frac=15, resolve_mixed.tolerance=7
consfreqfixed=0.50, resolve_mixed.min_secondary_frac=10, resolve_mixed.tolerance=5
